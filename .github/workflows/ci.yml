name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Validate, test, lint, build
    runs-on: ubuntu-latest
    # Dummy Firebase web config so modules that initialize Firebase at import
    # (src/lib/firebase.ts calls getAuth on load) construct in CI. No real project
    # and no secrets: the tests never call Firebase, they only need the client to
    # build without throwing auth/invalid-api-key.
    env:
      VITE_FIREBASE_API_KEY: ci-dummy-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-dummy
      VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:cidummy"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Match the functions runtime (functions/package.json engines.node).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate lesson content
        run: npm run validate:content

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Job-level `if:` cannot read secrets directly, so surface whether the Firebase
  # service account is configured as an output the deploy jobs gate on. Until the
  # secret is set (e.g. before the Spark migration), the deploy jobs are skipped
  # and CI stays green.
  check-deploy-secret:
    name: Check deploy secret
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Detect FIREBASE_SERVICE_ACCOUNT
        id: check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_SERVICE_ACCOUNT not set; skipping Hosting deploy (CI stays green)."
          fi

  # Deploy a per-PR preview channel. The build needs the Firebase web config; those
  # values are public (they ship in the bundle) so they come from repository
  # variables (Settings > Secrets and variables > Actions > Variables). Set all six
  # alongside the FIREBASE_SERVICE_ACCOUNT secret at migration.
  deploy-preview:
    name: Deploy PR preview
    needs: [gates, check-deploy-secret]
    if: github.event_name == 'pull_request' && needs.check-deploy-secret.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to a preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          expires: 7d

  # Deploy to the live channel on merge to main. Uses the project in .firebaserc.
  deploy-live:
    name: Deploy to live
    needs: [gates, check-deploy-secret]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-deploy-secret.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to the live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live

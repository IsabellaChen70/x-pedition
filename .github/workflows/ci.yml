name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Validate, test, lint, build
    runs-on: ubuntu-latest
    # Dummy Firebase web config so modules that initialize Firebase at import
    # (src/lib/firebase.ts calls getAuth on load) construct in CI. No real project
    # and no secrets: the tests never call Firebase, they only need the client to
    # build without throwing auth/invalid-api-key.
    env:
      VITE_FIREBASE_API_KEY: ci-dummy-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-dummy
      VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:cidummy"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Match the functions runtime (functions/package.json engines.node).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate lesson content
        run: npm run validate:content

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
